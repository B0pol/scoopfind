[package]
name = "scoopfind"
version = "1.0.0"
edition = "2024"
authors = ["B0pol"]
description = "A blazing-fast, modern TUI package search and pager for Scoop on Windows"
license = "MIT"
repository = "https://github.com/B0pol/scoopfind"
homepage = "https://github.com/B0pol/scoopfind"
readme = "README.md"
keywords = ["scoop", "tui", "windows", "package-manager", "search"]
categories = ["command-line-utilities"]
exclude = [".cargo", "AGENTS.md", ".github", "scoop", "bucket", "docs", ".githooks"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
regex = "1.13.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
