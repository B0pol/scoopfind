name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Release Binary
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Release Archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archiveName = "scoopfind-$tag-windows-x64"
          New-Item -ItemType Directory -Path $archiveName
          Copy-Item "target/x86_64-pc-windows-msvc/release/scoopfind.exe" -Destination "$archiveName/scoopfind.exe"
          Copy-Item "README.md" -Destination "$archiveName/README.md"
          Copy-Item "LICENSE" -Destination "$archiveName/LICENSE"
          
          Compress-Archive -Path "$archiveName/*" -DestinationPath "$archiveName.zip"
          
          $hash = (Get-FileHash -Path "$archiveName.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archiveName.zip" | Out-File -Encoding ascii "$archiveName.zip.sha256"
          
          Write-Host "Archive: $archiveName.zip"
          Write-Host "SHA256:  $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scoopfind-*-windows-x64.zip
            scoopfind-*-windows-x64.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
